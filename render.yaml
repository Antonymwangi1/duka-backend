services:
  - type: web
    name: duka-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: duka-redis
          type: redis
          property: connectionString

databases:
  - name: duka-redis
    plan: free